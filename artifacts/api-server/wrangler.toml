name = "maharashtra-electrical-shop-api"
main = "src/index.ts"
compatibility_date = "2025-05-05"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "maharashtra-electrical-shop"
# Replace this local placeholder with the database ID returned by `wrangler d1 create`
# before deploying to Cloudflare.
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "migrations"

[assets]
directory = "../maharashtra-electrical-store/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/5 * * * *"]
